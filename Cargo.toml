[workspace]
members = [
    "crates/app",
    "crates/codex/bridge",
    "crates/llm/core",
    "crates/channels/telegram-adapter",
    "crates/ui/dashboard",
    "crates/bots/code-agent",
    "crates/bots/simple-chat",
    "crates/bots/auto-approve",
    "crates/bots/all-bots",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates
codex-bridge = { path = "crates/codex/bridge" }
llm-core = { path = "crates/llm/core" }
telegram-adapter = { path = "crates/channels/telegram-adapter" }
dashboard = { path = "crates/ui/dashboard" }
code-agent = { path = "crates/bots/code-agent" }
simple-chat = { path = "crates/bots/simple-chat" }
auto-approve = { path = "crates/bots/auto-approve" }
all-bots = { path = "crates/bots/all-bots" }

# Codex deps
codex-core = { path = "../codex/codex-rs/core" }
codex-protocol = { path = "../codex/codex-rs/protocol" }
codex-login = { path = "../codex/codex-rs/login" }
codex-exec-server = { path = "../codex/codex-rs/exec-server" }
codex-models-manager = { path = "../codex/codex-rs/models-manager" }

# External deps
teloxide = { version = "0.13", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
eframe = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
